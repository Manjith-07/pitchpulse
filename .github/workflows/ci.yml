name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pitchpulse
          POSTGRES_PASSWORD: pitchpulse
          POSTGRES_DB: pitchpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: pitchpulse
      POSTGRES_PASSWORD: pitchpulse
      POSTGRES_DB: pitchpulse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install dbt
        run: pip install dbt-postgres~=1.8

      - name: Create raw schema
        # dbt's staging models select from raw_matches/raw_deliveries, so they
        # need to exist before `dbt build` runs. No Cricsheet data is
        # downloaded in CI (that's a large external dependency for a schema
        # check), so this creates just the empty tables -- dbt's tests
        # (not_null/unique/relationships/accepted_values) all pass vacuously
        # against zero rows, which is enough to confirm the SQL and test
        # definitions themselves are valid.
        working-directory: ingestion/batch
        run: |
          python -c "
          from load_cricsheet import ensure_schema, get_connection
          conn = get_connection()
          ensure_schema(conn)
          conn.close()
          "

      - name: Run dbt build
        working-directory: dbt/pitchpulse
        run: dbt build --profiles-dir .

      - name: Run pytest
        run: python -m pytest tests/ -v
