<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563" />
    </marker>
  </defs>

  <rect width="920" height="520" fill="#FFFFFF" />

  <!-- Column headers -->
  <text x="230" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">HISTORICAL</text>
  <text x="690" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">LIVE</text>

  <!-- Left column: batch pipeline -->
  <rect x="90" y="50" width="280" height="60" rx="8" fill="#EFF6EF" stroke="#3E8451" stroke-width="1.5" />
  <text x="230" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">Cricsheet archive</text>
  <text x="230" y="95" text-anchor="middle" font-size="12" fill="#4B5563">IPL ball-by-ball JSON</text>

  <line x1="230" y1="110" x2="230" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="90" y="150" width="280" height="60" rx="8" fill="#EFF6EF" stroke="#3E8451" stroke-width="1.5" />
  <text x="230" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">Batch pipeline</text>
  <text x="230" y="195" text-anchor="middle" font-size="12" fill="#4B5563">Airflow: loader script + dbt</text>

  <line x1="230" y1="210" x2="230" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="90" y="250" width="280" height="60" rx="8" fill="#EFF6EF" stroke="#3E8451" stroke-width="1.5" />
  <text x="230" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">Warehouse</text>
  <text x="230" y="295" text-anchor="middle" font-size="12" fill="#4B5563">Postgres: staging + mart tables</text>

  <!-- Right column: streaming pipeline -->
  <rect x="550" y="50" width="280" height="60" rx="8" fill="#FBEEEC" stroke="#B4402F" stroke-width="1.5" />
  <text x="690" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">Live cricket API</text>
  <text x="690" y="95" text-anchor="middle" font-size="12" fill="#4B5563">CricAPI match_info polling</text>

  <line x1="690" y1="110" x2="690" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="550" y="150" width="280" height="60" rx="8" fill="#FBEEEC" stroke="#B4402F" stroke-width="1.5" />
  <text x="690" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">Streaming pipeline</text>
  <text x="690" y="195" text-anchor="middle" font-size="12" fill="#4B5563">Kafka: producer to consumer</text>

  <line x1="690" y1="210" x2="690" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="550" y="250" width="280" height="60" rx="8" fill="#FBEEEC" stroke="#B4402F" stroke-width="1.5" />
  <text x="690" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">Real-time store</text>
  <text x="690" y="295" text-anchor="middle" font-size="12" fill="#4B5563">Redis: current match state</text>

  <!-- ML model, feeding into the streaming consumer -->
  <rect x="370" y="330" width="180" height="55" rx="8" fill="#F3F0FB" stroke="#6D5BA8" stroke-width="1.5" />
  <text x="460" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Win probability model</text>
  <text x="460" y="371" text-anchor="middle" font-size="11" fill="#4B5563">trained offline from the warehouse</text>

  <line x1="370" y1="280" x2="370" y2="357" stroke="#4B5563" stroke-width="1.5" />
  <line x1="370" y1="357" x2="376" y2="357" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="550" y1="357" x2="690" y2="357" stroke="#4B5563" stroke-width="1.5" />
  <line x1="690" y1="357" x2="690" y2="303" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Convergence into serving layer -->
  <line x1="230" y1="310" x2="230" y2="420" stroke="#4B5563" stroke-width="1.5" />
  <line x1="690" y1="310" x2="690" y2="420" stroke="#4B5563" stroke-width="1.5" />
  <line x1="230" y1="420" x2="690" y2="420" stroke="#4B5563" stroke-width="1.5" />
  <line x1="460" y1="420" x2="460" y2="440" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="320" y="440" width="280" height="35" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.5" />
  <text x="460" y="463" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Serving API — FastAPI</text>

  <line x1="460" y1="475" x2="460" y2="490" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="320" y="490" width="280" height="30" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.5" />
  <text x="460" y="510" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Dashboard — Streamlit</text>
</svg>
